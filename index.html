
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Special Gift  ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --wm-bg-top: #fff9f7;
      --wm-bg-bottom: #f6fbf7;
      --wm-melon: #f43f5e;       /* أحمر بطيخ مشرق */
      --wm-melon-deep: #be123c;  /* أحمر داكن للنصوص */
      --wm-melon-soft: #ffe4e8;  /* وردي/بطيخي ناعم */
      --wm-rind: #2f855a;        /* أخضر قشرة البطيخ */
      --wm-rind-soft: #e6f4ec;   /* أخضر فاتح ناعم */
      --wm-seed: #27272a;        /* لون بذور البطيخ */
      --text-dark: #1f2937;
      --text-muted: #5f6c65;
      --border-soft: #f9d8de;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, var(--wm-bg-top) 0%, var(--wm-bg-bottom) 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* شريط علوي رفيع بروح قشرة البطيخ */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--wm-rind), var(--wm-melon), var(--wm-rind));
      z-index: 50;
    }

    /* شاشة الفيديو الافتتاحية بثيم البطيخ */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(255, 247, 246, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      width: 100%;
      max-width: 740px;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid #fecdd5;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(244, 63, 94, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .intro-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--wm-rind);
      background: var(--wm-rind-soft);
      border: 1px solid #c6e6d4;
      padding: 5px 14px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    .intro-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--wm-melon-deep);
      text-align: center;
      line-height: 1.3;
    }

    .intro-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: -10px;
    }

    .intro-video-wrap {
      width: 100%;
      max-height: 54vh;
      border-radius: 18px;
      overflow: hidden;
      background: #fff4f5;
      border: 1px solid #ffd6de;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #intro-video {
      width: 100%;
      max-height: 54vh;
      object-fit: contain;
      opacity: 0.95;
      display: block;
    }

    .intro-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .intro-btn {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid #c6e6d4;
      background: var(--wm-rind-soft);
      color: var(--wm-rind);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .intro-btn:hover {
      filter: brightness(0.97);
      transform: translateY(-1px);
    }

    .intro-btn.primary {
      background: linear-gradient(135deg, #fb5a75, var(--wm-melon));
      color: #ffffff;
      border: none;
      box-shadow: 0 8px 20px rgba(244, 63, 94, 0.25);
    }

    /* عناصر بطيخ صغيرة وقلوب في الخلفية */
    #sparkles-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-spark {
      position: absolute;
      opacity: 0.45;
      animation: driftUp linear infinite;
    }

    @keyframes driftUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.52; }
      80% { opacity: 0.52; }
      100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; }
    }

    header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1180px;
      padding: 20px 28px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--wm-melon-soft);
      border: 2px solid var(--wm-rind);
      color: var(--wm-melon);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 3px 10px rgba(47, 133, 90, 0.14);
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--wm-melon-deep);
    }

    .brand-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-group {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .grid-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s;
    }

    .grid-btn.active {
      background: var(--wm-melon);
      color: #ffffff;
    }

    .tool-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s;
    }

    .tool-btn:hover { background: var(--wm-melon-soft); border-color: #fecdd5; }

    .tool-btn.pink-solid {
      background: linear-gradient(135deg, #fb5a75, var(--wm-melon));
      color: #ffffff;
      border: none;
    }

    .tool-btn.gold-soft {
      background: var(--wm-rind-soft);
      border-color: #c6e6d4;
      color: var(--wm-rind);
    }

    .memories-nav {
      position: relative;
      z-index: 10;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      padding: 4px 8px;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 4px 0 16px;
      box-shadow: 0 3px 10px rgba(47, 133, 90, 0.06);
    }

    .mem-tab {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mem-tab.active {
      background: linear-gradient(135deg, var(--wm-melon), var(--wm-rind));
      color: #ffffff;
    }

    .add-mem-link {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--wm-rind);
      padding: 5px 10px;
      cursor: pointer;
    }

    .main-card {
      position: relative;
      z-index: 10;
      width: 94%;
      max-width: 1120px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid var(--border-soft);
      border-radius: 24px;
      padding: 32px 36px;
      box-shadow: 0 18px 45px rgba(47, 133, 90, 0.07);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 36px;
      align-items: center;
    }

    @media (max-width: 880px) {
      .main-card { grid-template-columns: 1fr; padding: 22px 16px; justify-items: center; }
    }

    .board-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .board-frame {
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      border: 1.5px solid #d7ede0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    #puzzle-board {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 82vw;
      max-height: 82vw;
      background: #fff5f6;
      border-radius: 8px;
      overflow: hidden;
    }

  /*  #hint-bg {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
      background-position: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }*/
#hint-bg {
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
    .drop-slot {
      position: absolute;
      border: 1px solid rgba(47, 133, 90, 0.18);
      transition: background 0.15s ease;
    }

    .drop-slot.drag-over {
      background: rgba(244, 63, 94, 0.12);
    }

    .status-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--wm-melon-deep);
    }

    .progress-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      width: 96px;
      height: 6px;
      background: var(--wm-rind-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--wm-melon), var(--wm-rind));
      transition: width 0.3s ease;
    }

    .timer-badge {
      background: var(--wm-rind-soft);
      border: 1px solid #c6e6d4;
      color: var(--wm-rind);
      padding: 4px 12px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .right-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .polaroid {
      background: #ffffff;
      padding: 12px 12px 20px;
      border-radius: 4px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #f3f4f6;
      transform: rotate(1.5deg);
      width: 245px;
      text-align: center;
      transition: transform 0.25s ease;
    }

    .polaroid:hover { transform: rotate(0deg) scale(1.02); }

   /* .polaroid img {
      width: 100%;
      height: 205px;
      object-fit: cover;
      border-radius: 2px;
      background: #f9fafb;
    }*/
    .polaroid img {
  width: 100%;
  max-height: 225px;
  height: auto;
  object-fit: contain;
  background: #fff5f6;
}

    .polaroid-caption {
      margin-top: 12px;
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--wm-seed);
      line-height: 1.25;
      outline: none;
      user-select: text;
      cursor: text;
    }

    #pile-box {
      width: 390px;
      max-width: 100%;
      height: 215px;
      position: relative;
      background: #fff9fa;
      border: 1.5px dashed #a7d7bc;
      border-radius: 16px;
      overflow: hidden;
    }

    .tile-piece {
      position: absolute;
      border-radius: 4px;
      background-repeat: no-repeat;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.85);
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s ease;
    }

    .tile-piece:active {
      cursor: grabbing;
      z-index: 80 !important;
    }

    .tile-piece.placed {
      border-radius: 0;
      border: none;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
      transform: rotate(0deg) !important;
      z-index: 5 !important;
    }

    #win-banner {
      display: none;
      position: fixed;
      top: 75px;
      z-index: 100;
      background: linear-gradient(135deg, var(--wm-melon), var(--wm-rind));
      color: #fff;
      padding: 10px 26px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.25);
    }

    footer {
      position: relative;
      z-index: 10;
      margin-top: auto;
      padding: 18px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--wm-melon-deep);
    }
  </style>
</head>
<body>

  <!-- شاشة الفيديو الافتتاحية بثيم البطيخ -->

  <header>

      <div class="brand-icon">🍉</div>
      <div class="brand-text">
        <h1>The Chaos Archive✨</h1>
        <p>Every piece has a story, and every story has us.</p>

      <label class="tool-btn pink-solid">
        🖼 Add Our Photos
        <input type="file" id="upload-photos" accept="image/*" multiple hidden />
      </label>
      <button class="tool-btn gold-soft" onclick="saveGiftHtml()">⬇ Save Gift</button>
    </div>
  </header>

  <div class="memories-nav" id="memories-nav"></div>

  <div class="main-card">
    <div class="board-side">
      <div class="board-frame">
        <div id="puzzle-board">
          <div id="hint-bg"></div>
        </div>
      </div>
      <div class="status-bar">
        <div class="progress-group">
          <span id="progress-text">0 / 16 pieces placed</span>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>

        <div class="timer-badge" id="timer-display">⏱ 00:00</div>
      </div>

    <div class="right-side">
      <div class="polaroid">
        <img id="polaroid-img" src="" alt="Besties Memory" />
        <div id="polaroid-caption" class="polaroid-caption" contenteditable="true" title="Click to edit"></div>
      </div>

      <div id="pile-box"></div>
    </div>
  </div>

  <footer>Lovingly made by Shahd Mamdouh ♥</footer>

  <script id="embedded-data">
    // حطي أسماء صورك الأربعة هنا (في نفس فولدر الملف)
    let memories = [
      {
        src: "photo.jpg",
        caption: "Ya gama3a e7na 7elween awy! 🫣🥰🥰🥰"
      },
      {
        src: "photo2.jpg",
        caption: "Mafesh Tafaseel, El Sora Kafya 🙂‍↔️"
      },
      {
        src: "photo1.jpg",
        caption: "Mafesh 7ad 3a2el fel sora de 🙉😂"
      },
      
    ];
  </script>

  <script>
    const introScreen = document.getElementById('intro-screen');
    const introVideo = document.getElementById('intro-video');
    const muteBtn = document.getElementById('mute-btn');

    introVideo.play().then(() => {
      introVideo.muted = false;
      introVideo.play().catch(() => {
        introVideo.muted = true;
      });
    }).catch(() => {});

    introVideo.addEventListener('ended', closeIntro);
    introVideo.addEventListener('error', closeIntro);

    function toggleMute() {
      introVideo.muted = !introVideo.muted;
      if (!introVideo.muted) {
        introVideo.volume = 1;
        introVideo.play();
      }
      muteBtn.textContent = introVideo.muted ? '🔊 Sound On' : '🔇 Mute';
    }

    function closeIntro() {
      introVideo.pause();
      introScreen.classList.add('hidden');
      startTimer();
    }

    function replayIntro() {
      introVideo.currentTime = 0;
      introScreen.classList.remove('hidden');
      introVideo.play();
    }

    let secondsElapsed = 0;
    let timerInterval = null;
    const timerDisplay = document.getElementById('timer-display');

    function formatTime(totalSec) {
      const mins = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `⏱ ${mins}:${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerDisplay.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function resetTimer() {
      secondsElapsed = 0;
      timerDisplay.textContent = formatTime(0);
      if (introScreen.classList.contains('hidden')) {
        startTimer();
      }
    }

    let currentIdx = 0;
    let grid = 4;
    let draggedTile = null;

    const board = document.getElementById('puzzle-board');
    const hintBg = document.getElementById('hint-bg');
    const pileBox = document.getElementById('pile-box');
    const polaroidImg = document.getElementById('polaroid-img');
    const polaroidCaption = document.getElementById('polaroid-caption');
    const memoriesNav = document.getElementById('memories-nav');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const winBanner = document.getElementById('win-banner');

    function initSparkles() {
      const container = document.getElementById('sparkles-bg');
      const icons = ['♥', '✦', '•', '🍉', '🙉','🍉','🍉'];
      const colors = ['#f43f5e', '#2f855a', '#fb7185', '#27272a'];
      for (let i = 0; i < 20; i++) {
        const el = document.createElement('div');
        el.className = 'bg-spark';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (11 + Math.random() * 14) + 'px';
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (12 + Math.random() * 12) + 's';
        el.style.animationDelay = (-Math.random() * 15) + 's';
        container.appendChild(el);
      }
    }

    function renderMemoriesNav() {
      memoriesNav.innerHTML = '';
      memories.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = 'mem-tab' + (idx === currentIdx ? ' active' : '');
        btn.textContent = `👯‍♀️ Memory ${idx + 1}`;
        btn.onclick = () => loadMemory(idx);
        memoriesNav.appendChild(btn);
      });

      const addLabel = document.createElement('label');
      addLabel.className = 'add-mem-link';
      addLabel.innerHTML = `+ Add Photo <input type="file" accept="image/*" multiple hidden />`;
      addLabel.querySelector('input').addEventListener('change', handleFileUpload);
      memoriesNav.appendChild(addLabel);
    }

    function handleFileUpload(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          memories.push({
            src: ev.target.result,
            caption: "Another sweet squad memory ♥"
          });
          renderMemoriesNav();
          loadMemory(memories.length - 1);
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('upload-photos').addEventListener('change', handleFileUpload);

    polaroidCaption.addEventListener('input', () => {
      memories[currentIdx].caption = polaroidCaption.innerText;
    });

    function setGrid(n) {
      grid = n;
      [3, 4, 6].forEach(num => {
        document.getElementById(`g-${num}`).classList.toggle('active', num === n);
      });
      loadMemory(currentIdx);
    }

    function setPeek(state) {
      hintBg.style.opacity = state ? '0.4' : '0';
    }

    function resetBoard() {
      loadMemory(currentIdx);
    }

    function updateProgress() {
      const total = grid * grid;
      const placed = board.querySelectorAll('.tile-piece.placed').length;
      progressText.textContent = `${placed} / ${total} pieces placed`;
      progressFill.style.width = `${(placed / total) * 100}%`;
      if (placed === total) {
        clearInterval(timerInterval);
        winBanner.style.display = 'block';
      }
    }

    function loadMemory(idx) {
      currentIdx = idx;
      renderMemoriesNav();
      winBanner.style.display = 'none';
      resetTimer();

      const mem = memories[idx];
      polaroidImg.src = mem.src;
      polaroidCaption.innerText = mem.caption;
      hintBg.style.backgroundImage = `url("${mem.src}")`;

      buildTiles(mem.src);
    }

    function buildTiles(imgSrc) {
      board.querySelectorAll('.drop-slot, .tile-piece').forEach(el => el.remove());
      pileBox.innerHTML = '';

      const boardSize = board.clientWidth || 400;
      const slotSize = boardSize / grid;
      const traySize = Math.min(slotSize * 0.78, 76);

      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          const slot = document.createElement('div');
          slot.className = 'drop-slot';
          slot.style.width = slotSize + 'px';
          slot.style.height = slotSize + 'px';
          slot.style.left = (c * slotSize) + 'px';
          slot.style.top = (r * slotSize) + 'px';

          slot.addEventListener('dragover', (e) => {
            e.preventDefault();
            slot.classList.add('drag-over');
          });
          slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
          slot.addEventListener('drop', (e) => {
            e.preventDefault();
            slot.classList.remove('drag-over');
            if (draggedTile) tryPlaceTile(draggedTile, r, c, slotSize);
          });
          board.appendChild(slot);

          const tile = document.createElement('div');
          tile.className = 'tile-piece';
          tile.style.width = traySize + 'px';
          tile.style.height = traySize + 'px';
          tile.style.backgroundImage = `url("${imgSrc}")`;
          tile.style.backgroundSize = `${traySize * grid}px ${traySize * grid}px`;
          tile.style.backgroundPosition = `-${c * traySize}px -${r * traySize}px`;

          const maxX = Math.max(10, (pileBox.clientWidth || 380) - traySize - 10);
          const maxY = Math.max(10, (pileBox.clientHeight || 205) - traySize - 10);
          const randAngle = ((Math.random() - 0.5) * 28).toFixed(1);

          tile.style.left = (8 + Math.random() * maxX) + 'px';
          tile.style.top = (8 + Math.random() * maxY) + 'px';
          tile.style.transform = `rotate(${randAngle}deg)`;
          tile.style.zIndex = Math.floor(2 + Math.random() * 25);

          tile.dataset.row = r;
          tile.dataset.col = c;
          tile.draggable = true;

          tile.addEventListener('dragstart', () => { draggedTile = tile; });
          tile.addEventListener('dragend', () => { draggedTile = null; });

          tile.addEventListener('touchstart', () => { draggedTile = tile; }, { passive: true });
          tile.addEventListener('touchend', (e) => {
            if (!draggedTile) return;
            const touch = e.changedTouches[0];
            const rect = board.getBoundingClientRect();
            const relX = touch.clientX - rect.left;
            const relY = touch.clientY - rect.top;
            if (relX >= 0 && relX <= rect.width && relY >= 0 && relY <= rect.height) {
              const targetCol = Math.floor(relX / (rect.width / grid));
              const targetRow = Math.floor(relY / (rect.height / grid));
              tryPlaceTile(draggedTile, targetRow, targetCol, rect.width / grid);
            }
            draggedTile = null;
          });

          pileBox.appendChild(tile);
        }
      }

      updateProgress();
    }

    function tryPlaceTile(tile, targetRow, targetCol, slotSize) {
      const r = parseInt(tile.dataset.row);
      const c = parseInt(tile.dataset.col);
      if (r === targetRow && c === targetCol) {
        tile.classList.add('placed');
        tile.draggable = false;
        tile.style.width = slotSize + 'px';
        tile.style.height = slotSize + 'px';
        tile.style.backgroundSize = `${slotSize * grid}px ${slotSize * grid}px`;
        tile.style.backgroundPosition = `-${c * slotSize}px -${r * slotSize}px`;
        tile.style.left = (c * slotSize) + 'px';
        tile.style.top = (r * slotSize) + 'px';
        board.appendChild(tile);
        updateProgress();
      }
    }

    function saveGiftHtml() {
      const clone = document.documentElement.cloneNode(true);
      const dataTag = clone.querySelector('#embedded-data');
      dataTag.textContent = `let memories = ${JSON.stringify(memories)};`;

      const htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'besties-puzzle-gift.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    initSparkles();
    loadMemory(0);

    function fitBoardAndBuild(imgSrc, memIndex) {
  const img = new Image();
  img.onload = () => {
    const maxW = Math.min(410, window.innerWidth * 0.82);
    const maxH = Math.min(410, window.innerHeight * 0.55);
    const natW = img.naturalWidth || 400;
    const natH = img.naturalHeight || 400;
    const scale = Math.min(maxW / natW, maxH / natH);

    const boardW = Math.max(220, Math.round(natW * scale));
    const boardH = Math.max(220, Math.round(natH * scale));

    board.style.width = boardW + 'px';
    board.style.height = boardH + 'px';

    if (typeof buildTiles === 'function') {
      buildTiles(imgSrc, boardW, boardH);
    }
  };
  img.onerror = () => {
    board.style.width = '400px';
    board.style.height = '400px';
    if (typeof buildTiles === 'function') {
      buildTiles(imgSrc, 400, 400);
    }
  };
  img.src = imgSrc;
}
  </script>
